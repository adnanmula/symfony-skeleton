services:
  repository.dbal.connection:
    class: Doctrine\DBAL\Connection
    factory: 'AdnanMula\Skeleton\Infrastructure\Persistence\Repository\ConnectionFactory::create'
    arguments:
      - '%db_url%'

  repository.dbal.connection_default:
    class: Doctrine\DBAL\Connection
    factory: 'AdnanMula\Skeleton\Infrastructure\Persistence\Repository\ConnectionFactory::create'
    arguments:
      - '%db_url_default%'

  Doctrine\DBAL\Connection:
    alias: repository.dbal.connection

  Doctrine\DBAL\Driver\Connection:
    alias: repository.dbal.connection

  repository.dbal.base:
    class: AdnanMula\Skeleton\Infrastructure\Persistence\Repository\DbalRepository
    arguments:
      - '@repository.dbal.connection'
